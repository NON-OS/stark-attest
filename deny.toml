# Supply-chain policy for the attestation stack. The dependency
# surface is deliberately tiny; this keeps it that way and audited.

[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CC0-1.0",
  "Unicode-3.0",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# In-workspace path dependencies carry no version on purpose.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
